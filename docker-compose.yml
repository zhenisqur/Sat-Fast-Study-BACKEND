version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: satgg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: satgg
      POSTGRES_PASSWORD: satgg_dev_pass
      POSTGRES_DB: satgg_dev
    ports:
      - '5432:5432'
    volumes:
      - satgg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U satgg']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: satgg-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@satgg.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  satgg_pgdata: